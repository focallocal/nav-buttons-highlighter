nav_button_color_pairs:
  type: objects
  default:
    - selector: "li[data-filter=\"docs\"] > a"
      color: "#87CEEB"
    - selector: "li[data-filter=\"tasks\"] > a"
      color: "#20B2AA"
    - selector: "#ember143"
      color: "#FF8C00"
    - selector: ".kanban-nav"
      color: "#4CAF50"
  description: |
    Add one row per navigation pill you want to highlight. Use the browser inspector to copy the pill's CSS selector and provide the colour you want it to use.
  schema:
    name: "Nav button"
    properties:
      selector:
        type: string
        required: true
        validations:
          min_length: 1
      color:
        type: string
        required: true

active_outline_color:
  type: string
  default: rgba(255,255,255,0.85)
  description: Colour used for the active pill outline. Set to `transparent` to disable.
