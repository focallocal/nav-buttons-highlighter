nav_button_color_pairs:
  type: objects
  default:
    - selector: "a.kanban-nav"
      color: "#4CAF50"
    - selector: "a.docs"
      color: "#87CEEB"
    - selector: "#navigation-bar > li > a"
      color: "#2196F3"
  description: |
    Add one row per navigation pill you want to highlight. Use the browser inspector to copy the pill's CSS selector and provide the colour you want it to use. Examples: "a.kanban-nav" for links with class kanban-nav, "#navigation-bar > li > a" for all nav buttons, or "#navigation-bar > li:nth-child(2) > a" for the second button.
  schema:
    name: "Nav button"
    properties:
      selector:
        type: string
        required: true
        validations:
          min_length: 1
      color:
        type: string
        required: true

active_outline_color:
  type: string
  default: rgba(255,255,255,0.85)
  description: Colour used for the active pill outline. Set to `transparent` to disable.
