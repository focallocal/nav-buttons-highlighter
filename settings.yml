highlighted_buttons:
  type: objects
  default: 
    - selector: a.kanban-nav
      color: "#4285F4"
      label: "Kanban Tasks Button"
  description: "Configure which navigation buttons to highlight. Add multiple buttons by clicking 'Add Item'."
  schema:
    name: highlighted_buttons
    properties:
      selector:
        type: string
        required: true
        description: "CSS selector for the button (e.g., a.kanban-nav or a[href='/tasks'])"
      color:
        type: string
        default: "#4285F4"
        description: "Base color for the button gradient (hex format)"
      label:
        type: string
        description: "Descriptive name for this button (for your reference only)"

highlight_mobile_dropdown:
  type: bool
  default: true
  description: "Highlight the mobile 'Latest' dropdown toggle button"
